<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <title>Cardápio 3D</title>
  <link rel="stylesheet" href="styles.css?v=8" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
</head>
<body>

  <header class="topo">
    <div class="topo-inner">
      <h1>Cardápio</h1>
      <p class="sub">Toque em um prato para ver o tamanho real na sua mesa</p>
    </div>
  </header>

  <nav class="filtros" id="filtros"></nav>

  <main class="grade" id="grade"></main>

  <footer class="rodape">
    <p>Precisa de celular com câmera. No iPhone use o Safari, no Android use o Chrome.</p>
    <button class="link-diag" id="abrir-diag">diagnóstico</button>
  </footer>

  <!-- Tela do prato / AR -->
  <div class="folha" id="folha" hidden>
    <button class="fechar" id="fechar" aria-label="Fechar">&times;</button>

    <div class="visor">
      <model-viewer
        id="mv"
        alt=""
        loading="eager"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1"
        interaction-prompt="auto"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        ar-placement="floor">
        <div class="carregando" id="spinner" slot="progress-bar"></div>
        <!-- o model-viewer desenha um botao de AR proprio dentro do visor.
             Este slot vazio o apaga: quem abre o AR e' o "Ver em tamanho
             real" la' embaixo, para o cliente continuar vendo um botao so'. -->
        <button slot="ar-button" class="mv-ar-oculto" aria-hidden="true" tabindex="-1"></button>
      </model-viewer>

      <div class="medidas" id="medidas" hidden></div>
    </div>

    <div class="ficha">
      <div class="ficha-linha">
        <h2 id="f-nome"></h2>
        <span class="preco" id="f-preco"></span>
      </div>
      <p class="desc" id="f-desc"></p>

      <!-- o texto muda conforme o caminho disponivel; quem escreve e' o app.js -->
      <p class="dica-ar" id="dica-ar" hidden></p>

      <button class="btn-ar" id="btn-ver" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 1.5a1.5 1.5 0 0 0-3 0V10H9V3.5a1.5 1.5 0 0 0-3 0V13l-1.2-2a1.5 1.5 0 0 0-2.6 1.5l3 5.4A7 7 0 0 0 11.4 22H14a6 6 0 0 0 6-6V6.5a1.5 1.5 0 0 0-3 0V10h-1V3.5a1.5 1.5 0 0 0-3 0V10h-1V1.5z"/></svg>
        Ver em tamanho real
      </button>

      <p class="aviso" id="aviso" hidden></p>
    </div>
  </div>

  <!-- Câmera em tamanho real: o prato pousa na superfície apontada -->
  <div class="cam" id="cam" hidden>
    <video class="cam-video" id="cam-video" playsinline muted></video>
    <canvas class="cam-canvas" id="cam-canvas"></canvas>

    <!-- o centro da câmera é a sonda: aparece só enquanto procura a mesa -->
    <div class="cam-mira" id="cam-mira" hidden>
      <span class="cam-mira-anel"></span>
    </div>
    <button class="fechar" id="cam-fechar" aria-label="Fechar">&times;</button>
    <div class="cam-barra">
      <strong id="cam-titulo"></strong>
      <span id="cam-estado"></span>
    </div>
  </div>

  <script type="module" src="app.js?v=10"></script>
</body>
</html>
